name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Install LDC
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0

      - name: Build
        run: dub build --compiler=ldc2

      #- name: Run tests (note: no tests yet)
      #  run: dub -b unittest --compiler=ldc2

      - name: Package artifact
        run: tar czf alarmcal.tar.gz alarmcal views/*.css views/*.js

      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          body: "Automated build from ${{ github.sha }}"
          files: alarmcal.tar.gz
